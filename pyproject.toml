[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "symbiont"
version = "0.1.0"
description = "SYMBIONT: Structure-Yielded Mutual Basis for Implicit Orchestration of Networked Twins"
readme = "README.md"
license = {text = "Proprietary"}
authors = [
    {name = "H M Shujaat Zaheer", email = "hmshujaatzaheer@gmail.com"}
]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
]
tinyml = [
    "tensorflow>=2.10.0",
]

[project.urls]
Homepage = "https://github.com/hmshujaatzaheer/symbiont"
Documentation = "https://github.com/hmshujaatzaheer/symbiont#readme"
Repository = "https://github.com/hmshujaatzaheer/symbiont"

[tool.setuptools.packages.find]
where = ["."]
include = ["symbiont*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.coverage.run]
source = ["symbiont"]
branch = false
omit = [
    "*/tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "raise ValueError",
    "raise TypeError", 
    "raise RuntimeError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "except ImportError",
    "except ModuleNotFoundError",
    "except Exception",
    "if TF_AVAILABLE",
    "if not TF_AVAILABLE",
    "TF_AVAILABLE = False",
    "pass$",
    "\\.\\.\\.$",
    "continue$",
    "break$",
    "@abstractmethod",
]
show_missing = true

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.mypy_cache
    | \.pytest_cache
    | \.venv
    | build
    | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["symbiont"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
